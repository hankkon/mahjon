name: CI — Monorepo Build, Test & Godot QA Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-typecheck:
    name: Node.js Monorepo Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit Test Suite
        run: pnpm test

      - name: Run Monorepo Build
        run: pnpm build

  godot-qa-check:
    name: Godot 4.7 Headless Render Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7 Headless Engine
        run: |
          mkdir -p bin
          curl -sSL -o bin/godot.zip https://downloads.tuxfamily.org/godotengine/4.7/Godot_v4.7-stable_linux.x86_64.zip || curl -sSL -o bin/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip bin/godot.zip -d bin/
          mv bin/Godot_v4.7-stable_linux.x86_64 bin/godot || mv bin/Godot_v4.*_linux.x86_64 bin/godot
          chmod +x bin/godot

      - name: Run Godot Headless Client Render Check
        run: |
          ./bin/godot --headless --path apps/player-client res://qa_render_check.tscn
